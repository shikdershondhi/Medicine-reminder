<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Main Canvas -->

<!-- Hero Illustration Section -->
<section class="flex-1 flex flex-col items-center justify-center px-container-margin pt-xl">
<div class="relative w-full aspect-square max-h-[320px] mb-lg rounded-xl overflow-hidden shadow-sm border border-outline-variant/30">

</div>
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-xs tracking-tight">MedTrack</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Never miss a dose again.</p>
</div>
</section>
<!-- Interactive Onboarding Section -->
<section class="px-container-margin pb-xl space-y-lg">
<!-- Permission Previews (Bento-style chips) -->
<div class="grid grid-cols-2 gap-sm">
<div class="glass-card border border-outline-variant rounded-xl p-md flex flex-col items-center text-center shadow-sm">
<div class="bg-primary-fixed-dim text-on-primary-fixed-variant rounded-full p-sm mb-base">
<span class="material-symbols-outlined">notifications_active</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Notifications</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Instant alerts</span>
</div>
<div class="glass-card border border-outline-variant rounded-xl p-md flex flex-col items-center text-center shadow-sm">
<div class="bg-secondary-fixed text-on-secondary-fixed-variant rounded-full p-sm mb-base">
<span class="material-symbols-outlined">alarm</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Alarms</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Precise timing</span>
</div>
</div>
<!-- Action Area -->
<div class="space-y-md">
<button class="w-full h-[56px] bg-secondary-container text-on-secondary-container font-headline-sm text-headline-sm rounded-full flex items-center justify-center gap-md shadow-md transition-transform active:scale-95 duration-150">

<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"></path>

<div class="bg-surface-container-low rounded-xl p-md border border-outline-variant/50 flex gap-md">
<span class="material-symbols-outlined text-primary shrink-0" style="font-variation-settings: 'FILL' 1;">cloud_done</span>
<div>

</div>
</div>
</div>

          <a class="text-primary font-semibold underline" href="#">Privacy Policy</a>
</p>

</main>
<!-- Interactive Background Micro-animation -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Subtle parallax or hover effects could go here
      const chips = document.querySelectorAll('.glass-card');
      chips.forEach(chip => {
        chip.addEventListener('mouseenter', () => {
          chip.style.transform = 'translateY(-2px)';
          chip.style.transition = 'transform 0.2s ease-out';
        });
        chip.addEventListener('mouseleave', () => {
          chip.style.transform = 'translateY(0)';
        });
      });
    });
  </script>
