<style>
        .viewfinder-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #97f3e2; /* primary-fixed */
            border-width: 4px;
        }
        .v-top-left { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
        .v-top-right { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
        .v-bottom-left { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
        .v-bottom-right { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
        
        .scanning-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #97f3e2, transparent);
            box-shadow: 0 0 15px #97f3e2;
            animation: scan 3s ease-in-out infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .camera-shutter-active:active {
            transform: scale(0.9);
            transition: transform 0.1s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-black overflow-hidden select-none">
<!-- Top Navigation (Contextually Suppressed Shared Component Mock) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin py-lg bg-gradient-to-b from-black/60 to-transparent">

<div class="absolute inset-0">

<script>
        // Micro-interactions and UI State
        const shutterBtn = document.getElementById('shutter-btn');
        const flashToggle = document.getElementById('flash-toggle');
        const feedbackToast = document.getElementById('feedback-toast');

        // Simulate Shutter Capture
        shutterBtn.addEventListener('click', () => {
            // Screen Flash Effect
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[100] transition-opacity duration-300';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 300);
            }, 50);

            // Mock success feedback
            feedbackToast.classList.remove('opacity-0', '-translate-y-4');
            feedbackToast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                feedbackToast.classList.add('opacity-0', '-translate-y-4');
                feedbackToast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        });

        // Flash Toggle State
        let isFlashOn = false;
        flashToggle.addEventListener('click', () => {
            isFlashOn = !isFlashOn;
            const icon = flashToggle.querySelector('span');
            if(isFlashOn) {
                icon.innerText = 'flash_on';
                flashToggle.classList.add('bg-secondary-container', 'text-on-secondary-container');
                flashToggle.classList.remove('bg-white/10', 'text-white');
            } else {
                icon.innerText = 'flash_off';
                flashToggle.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                flashToggle.classList.add('bg-white/10', 'text-white');
            }
        });

        // Simulate Document Detection after 1s
        setTimeout(() => {
            const viewfinder = document.querySelector('.viewfinder-corner');
            // Change color to secondary to signal detection
            document.querySelectorAll('.viewfinder-corner').forEach(corner => {
                corner.style.borderColor = '#7c4dff'; // secondary-container
                corner.style.transition = 'border-color 0.5s ease';
            });
        }, 1200);
    </script>
